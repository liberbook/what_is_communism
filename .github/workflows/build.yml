name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the three editions in Docker
        run: ./docker_build.sh
      - name: Keep the books
        uses: actions/upload-artifact@v4
        with:
          name: books
          retention-days: 30
          path: |
            out/*/pdf/*.pdf
            out/*/print/*.pdf
            out/*/*.epub
            out/*/*.fb2
      - name: Assemble the site (the HTML editions)
        run: |
          mkdir -p _site/ru _site/uk _site/it
          cp site/index.html _site/
          cp out/russian/chto_takoe_kommunizm.html _site/ru/index.html
          cp out/ukrainian/shcho_take_komunizm.html _site/uk/index.html
          cp out/italiano/che_cose_il_comunismo.html _site/it/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
