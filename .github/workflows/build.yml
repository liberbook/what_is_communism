name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every edition in Docker
        run: ./docker_build.sh
      - name: Keep the books
        uses: actions/upload-artifact@v4
        with:
          name: books
          retention-days: 30
          path: |
            out/*/pdf/*.pdf
            out/*/print/*.pdf
            out/*/*.epub
            out/*/*.fb2
      - name: Check the editions (structure, glossary, outputs, generated docs)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/work/out" \
            what-is-communism-build python3 tools/checks/all.py
      - name: Assemble the site (the HTML editions, from languages.toml)
        run: python3 tools/render_docs.py --site _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
